[package]
edition = "2024"
name = "hazard3-gl5528"
version = "0.2.2"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async no_std GL5528 photoresistor driver for Hazard3, with optional upstream Embassy support."
documentation = "https://docs.rs/hazard3-gl5528"
readme = "README.md"
keywords = [
    "hazard3",
    "gl5528",
    "ldr",
    "photoresistor",
    "no-std",
]
categories = [
    "embedded",
    "no-std",
    "hardware-support",
]
license = "GPL-2.0-or-later"
repository = "https://github.com/jorgeandrecastro/hazard3-gl5528"

[lib]
name = "hazard3_gl5528"
path = "src/lib.rs"

[package.metadata.docs.rs]
default-target = "riscv32imac-unknown-none-elf"
targets = ["riscv32imac-unknown-none-elf"]

[dependencies]
hazard3-rp-backend = { package = "hazard3-rp", version = "0.2", optional = true }
embassy-rp = { version = "0.10", optional = true }

[features]
default = ["hal-hazard3", "rp235xa"]
hal-hazard3 = ["dep:hazard3-rp-backend"]
hal-upstream = ["dep:embassy-rp"]
rp2040 = ["embassy-rp?/rp2040"]
rp235xa = ["hazard3-rp-backend?/rp235xa", "embassy-rp?/rp235xa"]
rp235xb = ["hazard3-rp-backend?/rp235xb", "embassy-rp?/rp235xb"]
rp235x = ["rp235xa"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true